name: Build collapse image

on:
  push:
    branches:
      - 'deploy/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # The single place to bump the image version.
  IMAGE_VERSION: 2.8.0-collapse3

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            RELEASE_VERSION=v${{ env.IMAGE_VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/vikunja:${{ env.IMAGE_VERSION }}
            ghcr.io/${{ github.repository_owner }}/vikunja:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.description=Vikunja 2.8.0 with collapsible subtasks in the list view
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image digest
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/vikunja:${{ env.IMAGE_VERSION }}@${{ steps.build.outputs.digest }}
        run: |
          echo "IMAGE_DIGEST=${IMAGE_REF}"
          {
            echo "### Image pushed"
            echo
            echo "\`${IMAGE_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"
